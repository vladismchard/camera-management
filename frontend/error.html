<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка системы — Камера не обнаружена</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            text-align: center;
            padding: 40px;
            border: 1px solid #333;
            background-color: #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 {
            color: #ff4d4d;
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 30px;
        }
        .action-text {
            font-weight: bold;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            display: inline-block;
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Ошибка оборудования</h1>
        <p>Камера не обнаружена или сервер управления недоступен. Система не может инициализировать поток данных.</p>
        <div class="action-text">ПЕРЕЗАГРУЗИТЕ ПЛАТУ</div>
    </div>
</body>
</html>

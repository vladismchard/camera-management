<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Focus Detector</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welding Focus Detection & Stitching</h1>
        </header>
        
        <main>
            <div class="video-section">
                <img id="stream" alt="Camera Stream">
                
                <div class="autofocus-controls">
                    <h3>Autofocus</h3>
                    <div class="input-group">
                        <label for="numSteps">Steps:</label>
                        <input type="number" id="numSteps" value="3" min="2" max="10">
                        <label for="stepSize">Step Size:</label>
                        <input type="number" id="stepSize" value="1" min="1" max="5">
                    </div>
                    <button id="autofocusBtn" class="btn btn-info">Run Autofocus</button>
                </div>
                
                <div class="controls">
                    <button id="captureBtn" class="btn btn-primary">Capture Image</button>
                    <select id="stitchMethod" class="select">
                        <option value="horizontal">Horizontal</option>
                        <option value="vertical">Vertical</option>
                        <option value="grid">Grid</option>
                        <option value="panorama">Panorama (auto)</option>
                    </select>
                    <button id="stitchBtn" class="btn btn-success">Stitch Images</button>
                    <button id="clearBtn" class="btn btn-danger">Clear All</button>
                    <span class="counter">Images: <span id="imageCount">0</span></span>
                </div>
            </div>
            
            <div class="metrics-section">
                <div class="status-card">
                    <h2>Status</h2>
                    <div class="status-indicator" id="statusIndicator"></div>
                    <p class="status-text" id="statusText">Waiting...</p>
                </div>
                
                <div class="metrics-card">
                    <h2>Metrics</h2>
                    <div class="metric">
                        <span class="metric-label">Current Variance:</span>
                        <span class="metric-value" id="variance">0.00</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Average Variance:</span>
                        <span class="metric-value" id="avgVariance">0.00</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Threshold:</span>
                        <span class="metric-value" id="threshold">0.00</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">History Size:</span>
                        <span class="metric-value" id="historySize">0</span>
                    </div>
                </div>
                
                <div class="chart-card">
                    <h2>History</h2>
                    <canvas id="chart"></canvas>
                </div>
                
                <div class="autofocus-card">
                    <h2>Autofocus Results</h2>
                    <div id="autofocusResults"></div>
                    <div id="autofocusImage"></div>
                </div>
                
                <div class="stitched-card">
                    <h2>Stitched Result</h2>
                    <div id="stitchedResult"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js?v=4"></script>
</body>
</html>

<!-- frontend/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Focus Detector — Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welding Focus Detection</h1>
            <nav class="navbar">
                <a href="index.html" class="nav-link active">Stream</a>
                <a href="autofocus.html" class="nav-link">Autofocus</a>
                <a href="stitch.html" class="nav-link">Stitch</a>
                <button id="checkFocusBtn" class="btn btn-info focus-check-btn">Check Focus</button>
            </nav>
        </header>

        <main class="stream-main">
            <div class="video-section">
                <img id="stream" alt="Camera Stream">
            </div>

            <div class="metrics-section">
                <div class="status-card">
                    <h2>Manual Focus Check</h2>
                    <div class="status-indicator" id="statusIndicator"></div>
                    <p class="status-text" id="statusText">Press "Check Focus"</p>
                    <p id="lastCheckTime" class="last-check-time"></p>
                </div>

                <div class="metrics-card">
                    <h2>Last Check Metrics</h2>
                    <div class="metric">
                        <span class="metric-label">Variance:</span>
                        <span class="metric-value" id="variance">—</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Threshold:</span>
                        <span class="metric-value" id="threshold">—</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Avg Variance:</span>
                        <span class="metric-value" id="avgVariance">—</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">History Size:</span>
                        <span class="metric-value" id="historySize">—</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="stream.js"></script>
</body>
</html>

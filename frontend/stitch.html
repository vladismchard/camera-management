<!-- frontend/stitch.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детектор фокуса сварки — Склейка</title>
    <link rel="stylesheet" href="style.css">
    <script src="focus-mode-toggle.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <rect x="7" y="3" width="10" height="18" rx="2.5"/>
                    <circle cx="12" cy="12" r="6.5" fill="none"/>
                    <path d="M 12 5.5 L 12 18.5 M 5.5 12 L 18.5 12"/>
                </svg>
                <div class="brand-text">
                    <h1>Контроль фокуса сварки</h1>
                    <p class="subtitle">Станция управления машинным зрением</p>
                </div>
            </div>
            <nav class="navbar">
                <a href="index.html" class="nav-link">Поток</a>
                <a href="autofocus.html" class="nav-link">Автофокус</a>
                <a href="stitch.html" class="nav-link active">Склейка</a>
                <button id="checkFocusBtn" class="btn btn-info focus-check-btn">Проверить фокус</button>
            </nav>
        </header>

        <main class="stitch-main">
            <div class="stitch-controls-section">
                <div class="card">
                    <h2>Захват</h2>
                    <div class="stitch-preview">
                        <img id="stream" alt="Поток с камеры">
                    </div>
                    <div class="controls">
                        <button id="captureBtn" class="btn btn-primary">Захватить изображение</button>
                        <select id="stitchMethod" class="select">
                            <option value="horizontal">Горизонтально</option>
                            <option value="vertical">Вертикально</option>
                            <option value="grid">Сетка</option>
                            <option value="panorama">Панорама (авто)</option>
                        </select>
                        <button id="stitchBtn" class="btn btn-success" disabled>Склеить изображения</button>
                        <button id="clearBtn" class="btn btn-danger">Очистить всё</button>
                        <span class="counter">Изображения: <span id="imageCount">0</span></span>
                    </div>
                </div>

                <div class="card">
                    <h2>Журнал захвата</h2>
                    <div id="captureLog" class="capture-log"></div>
                </div>
            </div>

            <div class="stitch-result-section">
                <div class="card">
                    <h2>Результат склейки</h2>
                    <div id="stitchedResult">
                        <p class="message-empty">Захватите минимум 2 изображения в фокусе и склейте их</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="stitch.js"></script>
</body>
</html>

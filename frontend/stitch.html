<!-- frontend/stitch.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Focus Detector — Stitch</title>
    <link rel="stylesheet" href="style.css">
    <script src="focus-mode-toggle.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <rect x="7" y="3" width="10" height="18" rx="2.5"/>
                    <circle cx="12" cy="12" r="6.5" fill="none"/>
                    <path d="M 12 5.5 L 12 18.5 M 5.5 12 L 18.5 12"/>
                </svg>
                <div class="brand-text">
                    <h1>Welding Focus Detection</h1>
                    <p class="subtitle">Machine Vision Control Station</p>
                </div>
            </div>
            <nav class="navbar">
                <a href="index.html" class="nav-link">Stream</a>
                <a href="autofocus.html" class="nav-link">Autofocus</a>
                <a href="stitch.html" class="nav-link active">Stitch</a>
                <button id="checkFocusBtn" class="btn btn-info focus-check-btn">Check Focus</button>
            </nav>
        </header>

        <main class="stitch-main">
            <div class="stitch-controls-section">
                <div class="card">
                    <h2>Capture</h2>
                    <div class="stitch-preview">
                        <img id="stream" alt="Camera Stream">
                    </div>
                    <div class="controls">
                        <button id="captureBtn" class="btn btn-primary">Capture Image</button>
                        <select id="stitchMethod" class="select">
                            <option value="horizontal">Horizontal</option>
                            <option value="vertical">Vertical</option>
                            <option value="grid">Grid</option>
                            <option value="panorama">Panorama (auto)</option>
                        </select>
                        <button id="stitchBtn" class="btn btn-success" disabled>Stitch Images</button>
                        <button id="clearBtn" class="btn btn-danger">Clear All</button>
                        <span class="counter">Images: <span id="imageCount">0</span></span>
                    </div>
                </div>

                <div class="card">
                    <h2>Capture Log</h2>
                    <div id="captureLog" class="capture-log"></div>
                </div>
            </div>

            <div class="stitch-result-section">
                <div class="card">
                    <h2>Stitched Result</h2>
                    <div id="stitchedResult">
                        <p class="message-empty">Capture at least 2 focused images and stitch</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="stitch.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детектор фокуса сварки — Автофокус</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <rect x="7" y="3" width="10" height="18" rx="2.5"/>
                    <circle cx="12" cy="12" r="6.5" fill="none"/>
                    <path d="M 12 5.5 L 12 18.5 M 5.5 12 L 18.5 12"/>
                </svg>
                <div class="brand-text">
                    <h1>Контроль фокуса сварки</h1>
                    <p class="subtitle">Станция управления машинным зрением</p>
                </div>
            </div>
            <nav class="navbar">
                <a href="index.html" class="nav-link">Поток</a>
                <a href="autofocus.html" class="nav-link active">Автофокус</a>
                <a href="stitch.html" class="nav-link">Склейка</a>
            </nav>
        </header>

        <main class="autofocus-main">
            <div class="af-controls-section">
                <div class="card">
                    <h2>Сканирование автофокуса</h2>
                    <div class="input-group">
                        <label for="numSteps">Шаги:</label>
                        <input type="number" id="numSteps" value="5" min="3" max="15">
                    </div>
                    <div class="input-group">
                        <label for="stepSize">Размер шага:</label>
                        <input type="number" id="stepSize" value="1" min="1" max="5">
                    </div>
                    <button id="autofocusBtn" class="btn btn-primary">Запустить автофокус</button>
                </div>

                <div class="card">
                    <h2>Результаты</h2>
                    <div id="autofocusResults">
                        <p class="message-empty">Запустите сканирование автофокуса, чтобы увидеть результаты</p>
                    </div>
                </div>
            </div>

            <div class="af-frames-section">
                <div class="card">
                    <h2>Кадры автофокуса</h2>
                    <div id="autofocusImage">
                        <p class="message-empty">Кадр ещё не захвачен</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="focus-mode-toggle.js"></script>
    <script src="autofocus-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welding Focus Detector — Autofocus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welding Focus Detection</h1>
            <nav class="navbar">
                <a href="index.html" class="nav-link">Stream</a>
                <a href="autofocus.html" class="nav-link active">Autofocus</a>
                <a href="stitch.html" class="nav-link">Stitch</a>
            </nav>
        </header>

        <main class="autofocus-main">
            <div class="controls-section">
                <h2>Autofocus Scan</h2>
                <div class="control-group">
                    <label>Number of Steps:</label>
                    <input type="number" id="numSteps" value="5" min="3" max="15">
                </div>
                <div class="control-group">
                    <label>Step Size:</label>
                    <input type="number" id="stepSize" value="1" min="1" max="5">
                </div>
                <button id="startBtn" class="btn btn-primary">Start Autofocus</button>
            </div>

            <div class="results-section">
                <h2>Results</h2>
                <div id="resultsContainer"></div>
            </div>

            <div class="best-frame-section">
                <h2>Best Focused Frame</h2>
                <img id="bestFrame" alt="Best Frame">
            </div>
        </main>
    </div>

    <script src="focus-mode-toggle.js"></script>
    <script src="autofocus.js"></script>
</body>
</html>

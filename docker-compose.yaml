# docker-compose.yml
services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: focus-detector-backend:latest
    container_name: focus-detector-backend
    ports:
      - "5000:5000"
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    environment:
      - CAMERA_DEVICE=${CAMERA_DEVICE:-0}
    volumes:
      - ./stitched:/app/stitched
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: focus-detector-frontend:latest
    container_name: focus-detector-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped